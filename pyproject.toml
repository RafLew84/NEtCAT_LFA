[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
    "docs/source/_build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]  # Allow slice spacing compatible with Black

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "pyqtgraph.*",
    "pyvista",
    "pyvistaqt",
    "bm3d",
    "ase.*",
    "PyOpenGL.*",
]
ignore_missing_imports = true
